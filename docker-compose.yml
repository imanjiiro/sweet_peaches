# Заезд 2 (занятие 16). Всё приложение одной командой: docker compose up --build
# Для заезда 1 можно поднимать только redis: docker compose up redis
# Перед запуском создайте файл .env рядом с этим файлом и задайте SECRET_KEY (см. .env.example): без него compose не стартует.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: calc
      POSTGRES_PASSWORD: calc
      POSTGRES_DB: calc
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://calc:calc@db:5432/calc
      REDIS_URL: redis://redis:6379/0
      USE_QUEUE: "1"
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в файле .env рядом с docker-compose.yml}
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    ports: ["8000:8000"]
    volumes: ["media:/app/media"]
    depends_on: [db, redis]
  worker:
    build: .
    command: python manage.py rqworker
    environment:
      DATABASE_URL: postgres://calc:calc@db:5432/calc
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в файле .env рядом с docker-compose.yml}
    volumes: ["media:/app/media"]
    depends_on: [db, redis]
volumes:
  pgdata:
  media:
