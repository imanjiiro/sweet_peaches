{% load static %}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Очередь в приёмном отделении{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
<span class="brand">Приёмное отделение</span>
<nav>
  {% if user.is_authenticated %}
  <a href="{% url 'task_list' %}">Задачи</a>
  <a href="{% url 'task_create' %}">Новая задача</a>
  <a href="/api/docs">API</a>
  <a href="/admin/">Админка</a>
  <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Выйти ({{ user.username }})</button>
  </form>
  {% else %}
  <a href="{% url 'login' %}">Войти</a>
  <a href="{% url 'signup' %}">Регистрация</a>
  <a href="/api/docs">API</a>
  {% endif %}
</nav>
</div></header>
<div class="hero"><div class="hero-inner"><h1>{% block h1 %}{% endblock %}</h1></div></div>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
